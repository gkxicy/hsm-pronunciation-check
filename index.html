<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b28">
  <title>雅思与日语每日学习</title>
  <style>
    :root{font-family:"Noto Serif SC","Songti SC","Microsoft YaHei UI",serif;color:#17231f;background:#f3f1e8;--ink:#102b28;--paper:#fffdf6;--line:#d8d5c9;--green:#0f6658;--gold:#bd7a22;--red:#a43b2d;--muted:#64706b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#e5eee7 0,transparent 34%),linear-gradient(145deg,#f3f1e8,#f8f5ed);min-height:100vh}main{width:min(1060px,100%);margin:auto;padding:26px 20px 90px}.masthead{border-bottom:2px solid var(--ink);padding-bottom:18px}.eyebrow{font:700 12px/1.2 "Microsoft YaHei UI",sans-serif;letter-spacing:.18em;color:var(--gold)}.masthead h1{font-size:clamp(30px,6vw,58px);line-height:1.04;margin:10px 0;color:var(--ink);font-weight:900}.subtitle{color:var(--muted);margin:0;line-height:1.7}.date-row{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;align-items:end;margin-top:18px}label{display:block;font:700 14px/1.5 "Microsoft YaHei UI",sans-serif}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #c8ccc5;background:#fff;padding:12px;border-radius:8px;color:var(--ink)}textarea{min-height:110px;resize:vertical;line-height:1.65}button,.button-link{border:0;border-radius:8px;padding:11px 15px;background:var(--green);color:#fff;font:700 14px/1.25 "Microsoft YaHei UI",sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button.secondary,.button-link.secondary{background:#e8ece7;color:var(--ink)}button:disabled{opacity:.52;cursor:not-allowed}.status{padding:13px 15px;border-left:4px solid var(--green);background:#eaf2ed;margin:16px 0;border-radius:0 9px 9px 0;white-space:pre-line}.status.warn{border-color:var(--gold);background:#fff4de}.status.bad{border-color:var(--red);background:#faeae7}.task-nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.task-nav a{font:700 13px/1.2 "Microsoft YaHei UI",sans-serif;color:var(--ink);background:#e7e9e2;padding:10px 13px;border-radius:999px;text-decoration:none}.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.course{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 35px #24352d0c;overflow:hidden}.course-head{padding:22px;border-bottom:1px solid var(--line)}.course-head small{color:var(--gold);font:700 12px "Microsoft YaHei UI",sans-serif}.course-head h2{font-size:26px;margin:5px 0 8px;color:var(--ink)}.course-head p{margin:0;color:var(--muted);line-height:1.55}.section{padding:19px 22px;border-bottom:1px solid #ebe8df}.section:last-child{border-bottom:0}.section h3{font-size:18px;margin:0 0 10px;color:var(--ink)}.prose{white-space:pre-line;line-height:1.75;margin:0;color:#36423e}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.word{border:1px solid #deddd5;background:#fff;border-radius:9px;padding:10px}.word b{display:block;overflow-wrap:anywhere}.word span{display:block;color:var(--muted);font-size:13px;margin:4px 0 8px}.word-actions{display:flex;align-items:center;gap:7px}.word-actions button{padding:7px 9px;font-size:12px}.word-actions label{margin-left:auto;font-size:12px}.word-actions input{width:auto}.answer{margin-top:12px;border:1px dashed #b9b7ac;border-radius:9px;padding:11px}.answer summary{cursor:pointer;font-weight:800;color:var(--green)}.answer .prose{margin-top:12px}.field{margin-top:12px}.field small{display:block;color:var(--muted);font-weight:400}.checkline{display:flex;align-items:center;gap:8px;margin:12px 0}.checkline input{width:auto}.carryover{margin-bottom:18px}.carry-card{background:#fff8e8;border:1px solid #e7c88c;border-radius:10px;padding:14px;margin-top:9px}.carry-card h3{margin:0 0 6px}.submit-box{margin-top:20px;background:var(--ink);color:#fff;padding:22px;border-radius:14px}.submit-box h2{margin:0 0 7px}.submit-box p{color:#dce7e1;line-height:1.6}.submit-box button{background:#f0b35b;color:#17231f}.save-state{font-size:13px;color:var(--muted);margin:8px 0}.hidden{display:none!important}.quiz{border:0;border-radius:14px;width:min(92vw,520px);padding:22px}.quiz::backdrop{background:#102b28d9}.quiz h2{margin-top:0}.quiz-question{font-size:28px;font-weight:900;background:#eef4ef;padding:20px;border-radius:10px;margin:14px 0}.quiz-result{white-space:pre-line;min-height:30px}.record-list{display:grid;gap:8px}.record-line{border:1px solid var(--line);border-radius:9px;padding:11px}.record-line.current{border-color:var(--green);background:#edf5f0}.record-line .buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.record-line button{padding:7px 10px;font-size:12px}audio{width:100%;margin-top:12px}.feedback-card{background:#eef4ef;border-radius:10px;padding:14px;margin-top:10px}.feedback-card h4{margin:0 0 8px}.feedback-card p{white-space:pre-line;line-height:1.65}.version{font:600 11px "Microsoft YaHei UI",sans-serif;color:#78817c;margin-top:12px}@media(max-width:760px){main{padding:16px 12px 70px}.date-row,.day-grid{grid-template-columns:1fr}.day-grid{gap:14px}.course-head,.section{padding:17px}.vocab{grid-template-columns:1fr}.masthead h1{font-size:35px}.task-nav a{flex:1 1 42%;text-align:center}.links>*{flex:1 1 44%}button,.button-link{min-height:44px}.word-actions button{min-height:38px}.quiz{padding:17px}.quiz-question{font-size:24px}}
  </style>
  <style>
    .record-status{margin:12px 0;padding:11px 13px;border-radius:9px;background:#eef4ef;color:var(--ink);font:700 13px/1.55 "Microsoft YaHei UI",sans-serif}.record-status.active{background:#fff0dd;border:1px solid #e5a65b}.record-line.recording{border:2px solid var(--red);background:#fff4f1}.record-line .record-stop{background:var(--red);color:#fff}.record-playback{margin-top:12px;padding:12px;border-radius:9px;background:#eef4ef}.record-playback strong{display:block;margin-bottom:5px}.record-playback audio{margin-top:4px}
  </style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">365 DAY LANGUAGE DESK</div>
    <h1>雅思与日语<br>每日学习</h1>
    <p class="subtitle">课程、练习、答案解析、进度和复盘同步在一个页面。答案默认收起，先独立完成再核对。</p>
    <div class="date-row"><label>学习日期<input id="date" type="date"></label><button id="retrySave" class="secondary" type="button">重试云端保存</button></div>
  </header>
  <div id="planStatus" class="status">正在读取年度计划与晚间复盘调整…</div>
  <div id="saveState" class="save-state"></div>
  <nav class="task-nav"><a href="#carryover">补练</a><a href="#ielts">雅思英语</a><a href="#japanese">日语</a><a href="#submitArea">提交</a></nav>
  <section id="carryover" class="course carryover hidden"><div class="course-head"><small>昨晚复盘</small><h2>定向补练</h2><p>只显示未完成或未通过项目；已经通过的内容不重做。</p></div><div id="carryList" class="section"></div></section>
  <div id="loading" class="status">正在加载课程数据…</div>
  <div id="courses" class="day-grid hidden"><article id="ielts" class="course"></article><article id="japanese" class="course"></article></div>
  <section id="feedback" class="course hidden"><div class="course-head"><small>晚间复盘结果</small><h2>针对本次提交的解析</h2></div><div id="feedbackList" class="section"></div></section>
  <section id="submitArea" class="submit-box hidden"><h2>完成全部任务并提交复盘</h2><p>填写过程会自动暂存到本机和 Cloudflare。北京时间 23:00 前提交，等待当晚定时复盘；23:00 后提交，云端才会启动一次补充复盘并更新后续计划。</p><button id="submit" type="button">最终提交今日作业</button><div id="submitStatus"></div><div class="version">页面版本：20260918-ja-reading-3</div></section>
</main>
<dialog id="quiz" class="quiz"><button id="closeQuiz" class="secondary" type="button">关闭</button><h2 id="quizTitle">随机词测</h2><div id="quizMeta"></div><div id="quizQuestion" class="quiz-question"></div><label>你的答案<input id="quizAnswer" autocomplete="off" spellcheck="false"></label><button id="checkQuiz" type="button">提交答案</button><div id="quizResult" class="quiz-result"></div></dialog>
<script src="app.js?v=20260918-ja-reading-3"></script>
</body>
</html>
