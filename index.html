<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日发音练习</title>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}body{margin:0;padding:18px 12px 48px}main{max-width:820px;margin:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #183a6914}h1{margin:0 0 5px}.hint{color:#5d6675;line-height:1.65}.box{background:#f7f9fc;border-radius:12px;padding:14px;margin-top:16px}h2{font-size:18px;margin:0 0 9px}.words{display:flex;flex-wrap:wrap;gap:8px}.word{background:#fff;border:1px solid #d8e1ee;border-radius:8px;padding:7px 9px}.word b{display:block}.word span{font-size:13px;color:#64748b}textarea,select,button{font:inherit}textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}textarea{min-height:142px;line-height:1.55}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}button{border:0;border-radius:9px;padding:10px 13px;background:#155eef;color:#fff;font-weight:650;cursor:pointer}button.secondary{background:#e7edf8;color:#172033}button:disabled{opacity:.5}#status{min-height:25px;font-weight:650}.ok{color:#087443}.warn{color:#b54708}.bad{color:#b42318}.line{border-top:1px solid #e6eaf0;padding:11px 0}.target{font-weight:700}.heard{margin-top:5px;color:#475467}.pass{border-left:4px solid #12b76a;padding-left:9px}.retry{border-left:4px solid #f79009;padding-left:9px}.history li{line-height:1.65}code{background:#eef2f7;padding:2px 5px;border-radius:4px;word-break:break-word}</style></head>
<body><main><h1>每日发音练习</h1><p class="hint">每次识别后自动保存到这台设备。电脑用 Chrome/Edge，手机用 Chrome；首次识别请允许麦克风。它检查“能不能被听懂”，不假装给你口音打分。</p><label>查看日期 <input id="date" type="date"></label>
<div class="box"><h2 id="lessonTitle">今日任务</h2><div id="words" class="words"></div></div>
<div class="box"><h2>逐句发音自测</h2><p class="hint">每句先听参考音，再读。识别相似度达到 80% 才通过；没过只重读这一句，最多 3 次。</p><label>识别语言 <select id="language"><option value="de-DE">德语（de-DE）</option><option value="en-US">英语（en-US）</option></select></label><p></p><label>今日目标句（可替换姓名、城市）<textarea id="sentences"></textarea></label><div class="buttons"><button id="prepare" class="secondary">重新生成清单</button><button id="listen" class="secondary">听当前句参考音</button><button id="start">开始识别当前句</button></div><div id="status"></div><section id="results"></section></div>
<div class="box"><h2>保存与同步</h2><p class="hint">每一次识别都会自动保存，无需点“保存”。上方选日期即可查看当天练习和结果。受保护的一键同步后端尚未接入；在接入前网页不会假装“点一下就已经发给晚间复盘”。</p><button id="save" hidden></button><button id="submit" hidden></button><div id="submitStatus"></div></div>
<div class="box"><h2>回头复习</h2><ul id="history" class="history"></ul></div></main><script>
const lessons=[
{lang:'de-DE',title:'Day 1：自我介绍',words:[['ich','我'],['heißen','叫'],['kommen','来'],['aus','来自'],['China','中国'],['wohnen','居住'],['in','在'],['sprechen','说'],['Deutsch','德语'],['Englisch','英语']],sentences:['Hallo. Ich heiße [你的名字].','Ich komme aus China.','Ich wohne in [你的城市].','Ich spreche Chinesisch und ein bisschen Englisch.','Ich lerne Deutsch.']},
{lang:'de-DE',title:'Day 2：提问与基本信息',words:[['der Name','名字'],['der Beruf','职业'],['die Stadt','城市'],['das Land','国家'],['wer','谁'],['was','什么'],['wo','哪里'],['wie','怎样'],['gut','好'],['danke','谢谢']],sentences:['Wie heißt du?','Ich heiße [你的名字].','Was ist dein Beruf?','Ich wohne in [你的城市].','Danke, gut.']},
{lang:'de-DE',title:'Day 3：sein（是）',words:[['sein','是'],['bin','我是'],['bist','你是'],['ist','他/她/它是'],['sind','我们是'],['nicht','不'],['ja','是'],['nein','不'],['auch','也'],['sehr','非常']],sentences:['Ich bin [你的名字].','Du bist aus China.','Er ist in Berlin.','Wir sind Freunde.','Ich bin nicht müde.']},
{lang:'en-US',title:'Day 4：英语求职自我介绍',words:[['introduce','介绍'],['background','背景'],['responsible','负责的'],['achieved','达成'],['challenge','挑战'],['improve','改善'],['opportunity','机会'],['independent','独立的'],['goal','目标'],['prepare','准备']],sentences:['My name is [name].','I live in [city], China.','I have a bachelor’s degree in computer science.','I am applying for industrial sales roles.','I worked in industrial electrical sales.','I am preparing for overseas work.']},
{lang:'de-DE',title:'Day 5：来自与居住',words:[['und','和'],['aber','但是'],['oder','或者'],['jetzt','现在'],['heute','今天'],['morgen','明天'],['hier','这里'],['dort','那里'],['gern','乐意'],['bitte','请']],sentences:['Ich bin [你的名字].','Ich bin Chinese.','Ich bin Student.','Ich komme aus China.','Ich wohne in [你的城市].','Ich wohne hier.']},
{lang:'de-DE',title:'Day 6：名词性别',words:[['der Mann','男人'],['die Frau','女人'],['das Kind','孩子'],['der Freund','男性朋友'],['die Freundin','女性朋友'],['der Vater','父亲'],['die Mutter','母亲'],['das Haus','房子'],['die Wohnung','公寓'],['die Arbeit','工作']],sentences:['Das ist ein Mann.','Das ist eine Frau.','Das ist ein Kind.']},
{lang:'de-DE',title:'Day 7：本周复习',words:[['haben','有'],['habe','我有'],['hast','你有'],['hat','他/她有'],['ein','一个'],['eine','一个'],['kein','没有'],['keine','没有'],['mein','我的'],['deine','你的']],sentences:['Hallo.','Ich heiße [你的名字].','Ich komme aus China.','Ich wohne in [你的城市].','Ich spreche Chinesisch.','Ich lerne Deutsch.','Ich bin Student.','Ich habe Zeit.','Danke, gut.']}];
const $=id=>document.getElementById(id),key='hsm-pronunciation-history-v1',SR=window.SpeechRecognition||window.webkitSpeechRecognition;let lines=[],results=[],current=0;
function dateKey(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function lesson(){const a=Date.parse('2026-09-07T00:00:00Z'),t=Date.parse(dateKey()+'T00:00:00Z');return lessons[((Math.floor((t-a)/86400000)%7)+7)%7]}function norm(v){return v.toLocaleLowerCase().replace(/[.,!?;:'"，。！？；：]/g,'').replace(/ß/g,'ss').replace(/\s+/g,' ').trim()}function score(x,y){const a=norm(x).split(' ').filter(Boolean),b=norm(y).split(' ').filter(Boolean);if(!a.length||!b.length)return 0;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1])+1;return Math.max(0,Math.round((1-d[a.length][b.length]/Math.max(a.length,b.length))*100))}
function render(){$('results').innerHTML=lines.map((line,i)=>{const r=results[i],s=r?(r.pass?'pass':'retry'):'';const label=r?(r.pass?`通过 ${r.score}%`:`重读 ${r.score}%`):(i===current?'当前句':'未测试');return `<div class="line ${s}"><div class="target">${i+1}. ${line}</div><div class="heard">${label}${r?`；识别为：${r.heard}`:''}</div></div>`}).join('')}
function prepare(){lines=$('sentences').value.split('\n').map(x=>x.trim()).filter(Boolean);results=Array(lines.length);current=0;render();$('status').className='';$('status').textContent=`已生成 ${lines.length} 句。先听第 1 句，再开始识别。`}function speak(){if(!lines.length)prepare();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lines[current]);u.lang=$('language').value;u.rate=.82;speechSynthesis.speak(u)}
function recognize(){if(!lines.length)prepare();if(!SR){$('status').className='bad';$('status').textContent='当前浏览器不支持语音识别，请用最新版 Chrome 或 Edge。';return}const r=new SR();r.lang=$('language').value;r.interimResults=false;r.maxAlternatives=1;$('start').disabled=true;$('status').className='warn';$('status').textContent=`正在听第 ${current+1} 句，只读这一句后停两秒。`;r.onresult=e=>{const heard=e.results[0][0].transcript.trim(),s=score(lines[current],heard),pass=s>=80;results[current]={heard,score:s,pass};$('status').className=pass?'ok':'warn';$('status').textContent=pass?`第 ${current+1} 句通过（${s}%）。`:`第 ${current+1} 句未通过（${s}%），先听参考音再重读。`;if(pass&&current<lines.length-1)current++;render()};r.onerror=e=>{$('status').className='bad';$('status').textContent=`识别失败：${e.error}。确认麦克风权限和网络。`};r.onend=()=>{$('start').disabled=false};r.start()}
function report(){const passed=results.filter(x=>x?.pass).length,retry=results.map((x,i)=>x&&!x.pass?i+1:null).filter(Boolean),detail=results.map((x,i)=>x?`${i+1}. ${x.score}%：${x.heard}`:`${i+1}. 未测`).join('；');return {date:dateKey(),language:$('language').value.startsWith('de')?'德语':'英语',passed,total:lines.length,retry,detail,sentences:lines}}function history(){return JSON.parse(localStorage.getItem(key)||'[]')}function renderHistory(){const x=history();$('history').innerHTML=x.length?x.slice(0,30).map(r=>`<li><b>${r.date} ${r.language}</b>：通过 ${r.passed}/${r.total}；需重读 ${r.retry.length?r.retry.join('、'):'无'}。</li>`).join(''):'<li>还没有提交记录。</li>'}function save(){const r=report(),x=history().filter(i=>!(i.date===r.date&&i.language===r.language));x.unshift(r);localStorage.setItem(key,JSON.stringify(x));renderHistory();$('submitStatus').className='ok';$('submitStatus').textContent='已保存到这台设备；提交后晚间复盘才能读取。'}function submit(){const r=report();save();const body=`<!-- HSM_PRONUNCIATION_REPORT -->\n日期：${r.date}\n语言：${r.language}\n识别通过：${r.passed}/${r.total}\n需重读第：${r.retry.length?r.retry.join('、'):'无'}句\n目标句：${r.sentences.join(' / ')}\n识别明细：${r.detail}`;const url='https://github.com/gkxicy/hsm-life-system/issues/new?title='+encodeURIComponent('发音回传 '+r.date)+'&body='+encodeURIComponent(body);$('submitStatus').className='warn';$('submitStatus').textContent='已打开私有仓库的预填 Issue；请在 GitHub 页面点一次 Submit new issue，晚间复盘才会收到。';window.open(url,'_blank','noopener')}function load(){const l=lesson();$('lessonTitle').textContent=`${dateKey()} · ${l.title}`;$('language').value=l.lang;$('words').innerHTML=l.words.map(x=>`<div class="word"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('sentences').value=l.sentences.join('\n');prepare();renderHistory()}$('prepare').onclick=prepare;$('listen').onclick=speak;$('start').onclick=recognize;$('save').onclick=save;$('submit').onclick=submit;load();
const originalLoad=load;let viewedDate=dateKey();dateKey=()=>viewedDate;save=()=>{const r=report(),x=history().filter(i=>!(i.date===r.date&&i.language===r.language));r.results=results;x.unshift(r);localStorage.setItem(key,JSON.stringify(x));renderHistory();$('submitStatus').className='ok';$('submitStatus').textContent='已自动保存到这台设备。'};function loadViewed(){originalLoad();const old=history().find(x=>x.date===viewedDate&&x.language===($('language').value.startsWith('de')?'德语':'英语'));if(old){$('sentences').value=old.sentences.join('\n');lines=old.sentences;results=old.results||[];current=Math.max(0,results.findIndex(x=>!x?.pass));if(current<0)current=0;render();$('status').className='ok';$('status').textContent='已加载这一天的保存结果。'}}$('date').value=viewedDate;$('date').onchange=()=>{viewedDate=$('date').value||viewedDate;loadViewed()};new MutationObserver(()=>{if(results.some(Boolean))save()}).observe($('results'),{childList:true,subtree:true});loadViewed();
</script></body></html>
