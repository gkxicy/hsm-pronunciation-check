<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日发音练习</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}body{margin:0;padding:18px 12px 48px}main{max-width:820px;margin:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #183a6914}h1{margin:0 0 5px;font-size:26px}.hint{color:#5d6675;line-height:1.65}.box{background:#f7f9fc;border-radius:12px;padding:14px;margin-top:16px}h2{font-size:18px;margin:0 0 9px}.words{display:flex;flex-wrap:wrap;gap:8px}.word{background:#fff;border:1px solid #d8e1ee;border-radius:8px;padding:7px 9px}.word b{display:block}.word span{font-size:13px;color:#64748b}textarea,select,input,button{font:inherit}textarea,select,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}textarea{min-height:142px;line-height:1.55}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}button{border:0;border-radius:9px;padding:10px 13px;background:#155eef;color:#fff;font-weight:650;cursor:pointer}button.secondary{background:#e7edf8;color:#172033}button:disabled{opacity:.5}#status,#submitStatus{min-height:25px;font-weight:650}.ok{color:#087443}.warn{color:#b54708}.bad{color:#b42318}.line{border-top:1px solid #e6eaf0;padding:11px 0}.target{font-weight:700}.heard{margin-top:5px;color:#475467}.pass{border-left:4px solid #12b76a;padding-left:9px}.retry{border-left:4px solid #f79009;padding-left:9px}.history li{line-height:1.65}label{display:block;margin:10px 0 5px;font-weight:650}
  </style>
</head>
<body><main>
  <h1>每日发音练习</h1>
  <p class="hint">每次识别后自动保存到这台设备。电脑用 Chrome/Edge，手机用 Chrome；首次识别请允许麦克风。它只检查语音识别能否听懂，不假装给你口音打分。</p>
  <label>查看日期 <input id="date" type="date"></label>
  <div class="box"><h2 id="lessonTitle">今日任务</h2><div id="words" class="words"></div></div>
  <div class="box">
    <h2>逐句发音自测</h2><p class="hint">每句先听参考音，再读。识别相似度达到 80% 才通过；没过只重读这一句，最多 3 次。</p>
    <label>识别语言 <select id="language"><option value="de-DE">德语（de-DE）</option><option value="en-US">英语（en-US）</option></select></label>
    <label>今日目标句（可替换姓名、城市）<textarea id="sentences"></textarea></label>
    <div class="buttons"><button id="prepare" class="secondary">重新生成清单</button><button id="listen" class="secondary">听当前句参考音</button><button id="start">开始识别当前句</button></div>
    <div id="status"></div><section id="results"></section>
  </div>
  <div class="box">
    <h2>提交给晚间复盘</h2><p class="hint">识别结果会自动保存。完成后只需要点一次下面的按钮；成功后不用打开 GitHub，也不用把结果写进日记。</p>
    <button id="submit">提交今日结果</button><div id="submitStatus"></div>
  </div>
  <div class="box"><h2>回头复习</h2><ul id="history" class="history"></ul></div>
</main><script>
const API="https://hsm-pronunciation-api.huangsm666.workers.dev";
const lessons=[
 {lang:'de-DE',title:'Day 1：自我介绍',words:[['ich','我'],['heißen','叫'],['kommen','来'],['aus','来自'],['China','中国'],['wohnen','居住'],['in','在'],['sprechen','说'],['Deutsch','德语'],['Englisch','英语']],sentences:['Hallo. Ich heiße [你的名字].','Ich komme aus China.','Ich wohne in [你的城市].','Ich spreche Chinesisch und ein bisschen Englisch.','Ich lerne Deutsch.']},
 {lang:'de-DE',title:'Day 2：提问与基本信息',words:[['der Name','名字'],['der Beruf','职业'],['die Stadt','城市'],['das Land','国家'],['wer','谁'],['was','什么'],['wo','哪里'],['wie','怎样'],['gut','好'],['danke','谢谢']],sentences:['Wie heißt du?','Ich heiße [你的名字].','Was ist dein Beruf?','Ich wohne in [你的城市].','Danke, gut.']},
 {lang:'de-DE',title:'Day 3：sein（是）',words:[['sein','是'],['bin','我是'],['bist','你是'],['ist','他/她/它是'],['sind','我们是'],['nicht','不'],['ja','是'],['nein','不'],['auch','也'],['sehr','非常']],sentences:['Ich bin [你的名字].','Du bist aus China.','Er ist in Berlin.','Wir sind Freunde.','Ich bin nicht müde.']},
 {lang:'en-US',title:'Day 4：英语求职自我介绍',words:[['introduce','介绍'],['background','背景'],['responsible','负责的'],['achieved','达成'],['challenge','挑战'],['improve','改善'],['opportunity','机会'],['independent','独立的'],['goal','目标'],['prepare','准备']],sentences:['My name is [name].','I live in [city], China.','I have a bachelor’s degree in computer science.','I am applying for industrial sales roles.','I worked in industrial electrical sales.','I am preparing for overseas work.']},
 {lang:'de-DE',title:'Day 5：名词性别',words:[['der Mann','男人'],['die Frau','女人'],['das Kind','孩子'],['der Freund','男性朋友'],['die Freundin','女性朋友'],['der Vater','父亲'],['die Mutter','母亲'],['das Haus','房子'],['die Wohnung','公寓'],['die Arbeit','工作']],sentences:['Das ist ein Mann.','Das ist eine Frau.','Das ist ein Kind.']},
 {lang:'de-DE',title:'Day 6：haben（有）',words:[['haben','有'],['habe','我有'],['hast','你有'],['hat','他/她有'],['ein','一个'],['eine','一个'],['kein','没有'],['keine','没有'],['mein','我的'],['deine','你的']],sentences:['Ich habe Zeit.','Du hast Arbeit.','Er hat ein Haus.']},
 {lang:'de-DE',title:'Day 7：本周复习',words:[['Hallo','你好'],['heißen','叫'],['kommen','来'],['wohnen','居住'],['sprechen','说'],['lernen','学习'],['Student','学生'],['haben','有'],['Zeit','时间'],['danke','谢谢']],sentences:['Hallo.','Ich heiße [你的名字].','Ich komme aus China.','Ich wohne in [你的城市].','Ich spreche Chinesisch.','Ich spreche ein bisschen Englisch.','Ich lerne Deutsch.','Ich bin Student.','Ich habe Zeit.','Danke, gut.']}
];
const $=id=>document.getElementById(id),storageKey='hsm-pronunciation-history-v2',SR=window.SpeechRecognition||window.webkitSpeechRecognition;let lines=[],results=[],current=0,viewedDate;
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function lesson(){const start=Date.parse('2026-09-07T00:00:00Z'),chosen=Date.parse(viewedDate+'T00:00:00Z');return lessons[((Math.floor((chosen-start)/86400000)%7)+7)%7]}
function norm(v){return v.toLocaleLowerCase().replace(/[.,!?;:'”，。！？；：]/g,'').replace(/ß/g,'ss').replace(/\s+/g,' ').trim()}
function score(expected,heard){const a=norm(expected).split(' ').filter(Boolean),b=norm(heard).split(' ').filter(Boolean);if(!a.length||!b.length)return 0;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1])+1;return Math.max(0,Math.round((1-d[a.length][b.length]/Math.max(a.length,b.length))*100))}
function languageName(){return $('language').value.startsWith('de')?'德语':'英语'}
function allHistory(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return[]}}
function saveLocal(){const record={date:viewedDate,lessonTitle:$('lessonTitle').textContent,language:$('language').value,sentences:lines,results,updatedAt:new Date().toISOString()};const kept=allHistory().filter(x=>!(x.date===record.date&&x.language===record.language));kept.unshift(record);localStorage.setItem(storageKey,JSON.stringify(kept.slice(0,180)));renderHistory()}
function renderHistory(){const data=allHistory();$('history').innerHTML=data.length?data.slice(0,30).map(r=>{const passed=(r.results||[]).filter(x=>x?.passed).length;return `<li><b>${r.date} ${r.language.startsWith('de')?'德语':'英语'}</b>：通过 ${passed}/${r.sentences.length}；上方选择日期可加载。</li>`}).join(''):'<li>还没有保存记录。</li>'}
function render(){$('results').innerHTML=lines.map((line,i)=>{const r=results[i],state=r?(r.passed?'pass':'retry'):'';const label=r?(r.passed?`通过 ${r.score}%`:`重读 ${r.score}%`):(i===current?'当前句':'未测试');return `<div class="line ${state}"><div class="target">${i+1}. ${line}</div><div class="heard">${label}${r?`；识别为：${r.transcript}`:''}</div></div>`}).join('')}
function prepare(){lines=$('sentences').value.split('\n').map(x=>x.trim()).filter(Boolean);results=Array(lines.length);current=0;render();$('status').className='';$('status').textContent=`已生成 ${lines.length} 句。先听第 1 句，再开始识别。`;saveLocal()}
function speak(){if(!lines.length)prepare();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lines[current]);u.lang=$('language').value;u.rate=.82;speechSynthesis.speak(u)}
function recognize(){if(!lines.length)prepare();if(!SR){$('status').className='bad';$('status').textContent='当前浏览器不支持语音识别，请用最新版 Chrome 或 Edge。';return}const rec=new SR();rec.lang=$('language').value;rec.interimResults=false;rec.maxAlternatives=1;$('start').disabled=true;$('status').className='warn';$('status').textContent=`正在听第 ${current+1} 句，只读这一句后停两秒。`;rec.onresult=e=>{const transcript=e.results[0][0].transcript.trim(),value=score(lines[current],transcript),passed=value>=80;results[current]={target:lines[current],transcript,score:value,passed};$('status').className=passed?'ok':'warn';$('status').textContent=passed?`第 ${current+1} 句通过（${value}%）。`:`第 ${current+1} 句未通过（${value}%），先听参考音再重读。`;if(passed&&current<lines.length-1)current++;render();saveLocal()};rec.onerror=e=>{$('status').className='bad';$('status').textContent=`识别失败：${e.error}。确认麦克风权限和网络。`};rec.onend=()=>{$('start').disabled=false};rec.start()}
function loadDay(){const l=lesson(),old=allHistory().find(x=>x.date===viewedDate&&x.language===l.lang);$('lessonTitle').textContent=`${viewedDate} · ${l.title}`;$('language').value=l.lang;$('words').innerHTML=l.words.map(([word,meaning])=>`<div class="word"><b>${word}</b><span>${meaning}</span></div>`).join('');$('sentences').value=(old?.sentences||l.sentences).join('\n');lines=$('sentences').value.split('\n').filter(Boolean);results=old?.results||Array(lines.length);current=Math.max(0,results.findIndex(x=>!x?.passed));if(current<0)current=0;render();renderHistory();$('status').className=old?'ok':'';$('status').textContent=old?'已加载当天保存结果。':'已生成当天任务。'}
async function submit(){const completed=results.filter(Boolean);if(!completed.length){$('submitStatus').className='bad';$('submitStatus').textContent='还没有识别结果，至少完成一句再提交。';return}saveLocal();$('submit').disabled=true;$('submitStatus').className='warn';$('submitStatus').textContent='正在提交…';try{const response=await fetch(`${API}/submit`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:viewedDate,lessonTitle:$('lessonTitle').textContent,language:languageName(),results:completed})});const body=await response.json();if(!response.ok||!body.ok)throw new Error(body.error||`HTTP ${response.status}`);$('submitStatus').className='ok';$('submitStatus').textContent='已提交，今晚复盘会自动读取。你不需要再做其他操作。'}catch(error){$('submitStatus').className='bad';$('submitStatus').textContent=`提交失败：${error.message}。先确认网络后重试。`}finally{$('submit').disabled=false}}
viewedDate=today();$('date').value=viewedDate;$('date').onchange=()=>{viewedDate=$('date').value||today();loadDay()};$('prepare').onclick=prepare;$('listen').onclick=speak;$('start').onclick=recognize;$('submit').onclick=submit;loadDay();
</script></body></html>
